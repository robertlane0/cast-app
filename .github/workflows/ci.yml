# CI gate per AGENTS.md §4: fmt --check -> clippy -D warnings -> test ->
# build -> cargo run -p xtask (memory-safety scan) -> cargo deny check, across
# the supported OS matrix, with the committed Cargo.lock uploaded as an
# artifact.
#
# Linux needs OpenGL/EGL, GBM, and PipeWire development headers for the GUI
# and screen-capture stacks (see the "Install Ubuntu dependencies" step).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spec 01 §8: "macOS 13+"; macos-14 is the long-lived Intel runner.
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Install stable Rust (rust-toolchain.toml: stable + rustfmt + clippy)"
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libpipewire-0.3-dev libgbm-dev

      - name: fmt
        run: cargo fmt --check

      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (e2e-cast feature)
        run: cargo clippy --all-targets --features e2e-cast -- -D warnings

      - name: test
        run: cargo test --all

      - name: test (doc)
        run: cargo test --doc

      # Real-device tests never run in CI (they need a Chromecast), but the
      # feature-gated target must keep compiling.
      - name: e2e-cast target compiles
        run: cargo test --features e2e-cast --test cast_e2e --no-run

      - name: build
        run: cargo build

      - name: build (release profile)
        run: cargo build --release

      # The xtask binary is the single memory-safety gate (AGENTS.md Phase 0).
      # It replaced the shell-script gate so the check runs natively on all
      # three CI OSes without a bash dependency.
      - name: memory-safety scan (xtask)
        run: cargo run -p xtask

      - name: cargo deny check (Linux)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: cargo deny check (Windows)
        if: runner.os == 'Windows'
        run: cargo install --locked cargo-deny && cargo deny check
        env:
          RUST_BACKTRACE: 1

      - name: cargo deny check (macOS)
        if: runner.os == 'macOS'
        run: cargo install --locked cargo-deny && cargo deny check
        env:
          RUST_BACKTRACE: 1

      - name: Upload Cargo.lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock-${{ matrix.os }}
          path: Cargo.lock
          if-no-files-found: error
